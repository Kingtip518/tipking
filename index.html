<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TipKing — Expert Football Tips</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-card:#1a2236;--bg-card-hover:#1f2a42;--accent-gold:#f59e0b;--accent-gold-dim:#b45309;--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#1e293b;--border-accent:#334155;--gradient-gold:linear-gradient(135deg,#f59e0b,#d97706,#b45309);--gradient-premium:linear-gradient(135deg,#f59e0b 0%,#fbbf24 50%,#f59e0b 100%);--shadow-glow:0 0 30px rgba(245,158,11,0.15);--shadow-card:0 4px 24px rgba(0,0,0,0.4)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Source Sans 3',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-primary)}::-webkit-scrollbar-thumb{background:var(--accent-gold-dim);border-radius:3px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 5px rgba(245,158,11,0.3)}50%{box-shadow:0 0 20px rgba(245,158,11,0.6)}}
@keyframes live-dot{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

header{position:fixed;top:0;left:0;right:0;background:rgba(10,14,23,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:1000;padding:0 24px}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:42px;height:42px;background:var(--gradient-gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--bg-primary);font-family:'Oswald',sans-serif;box-shadow:0 2px 12px rgba(245,158,11,0.3)}
.logo-text{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;background:var(--gradient-premium);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.logo-sub{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-top:-4px}
nav{display:flex;gap:4px;align-items:center}
nav a{color:var(--text-secondary);text-decoration:none;padding:8px 13px;border-radius:8px;font-size:13px;font-weight:500;transition:all 0.2s;cursor:pointer;white-space:nowrap}
nav a:hover,nav a.active{color:var(--text-primary);background:rgba(245,158,11,0.1)}nav a.active{color:var(--accent-gold)}
.nav-actions{display:flex;gap:8px;align-items:center}
.btn-login{background:transparent;border:1px solid var(--accent-gold);color:var(--accent-gold);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.25s;font-family:'Source Sans 3',sans-serif}
.btn-login:hover{background:var(--accent-gold);color:var(--bg-primary)}
.btn-signup{background:var(--gradient-gold);border:none;color:var(--bg-primary);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.25s;font-family:'Source Sans 3',sans-serif}
.btn-signup:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow)}
.lang-switch{display:flex;background:var(--bg-card);border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-right:4px}
.lang-btn{padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all 0.2s;font-family:'Source Sans 3',sans-serif;display:flex;align-items:center;gap:4px}
.lang-btn.active{background:rgba(245,158,11,0.15);color:var(--accent-gold)}.lang-btn:hover:not(.active){color:var(--text-secondary)}

.hero{margin-top:68px;padding:80px 24px 60px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at center,rgba(245,158,11,0.06) 0%,transparent 60%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:50px;padding:6px 18px;font-size:12px;font-weight:600;color:var(--accent-gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:24px}
.hero-badge .dot{width:8px;height:8px;background:var(--accent-green);border-radius:50%;animation:live-dot 1.5s ease-in-out infinite}
.hero h1{font-family:'Oswald',sans-serif;font-size:clamp(36px,6vw,72px);font-weight:700;line-height:1.05;margin-bottom:20px}
.hero h1 .gold{background:var(--gradient-premium);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:18px;color:var(--text-secondary);max-width:600px;margin:0 auto 36px;line-height:1.7}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.hero-cta .btn-signup,.hero-cta .btn-login{padding:14px 36px;font-size:16px;border-radius:12px}
.hero-stats{display:flex;gap:48px;justify-content:center;margin-top:40px;flex-wrap:wrap}
.hero-stat{text-align:center}.hero-stat .num{font-family:'Oswald',sans-serif;font-size:40px;font-weight:700;color:var(--accent-gold);display:block}
.hero-stat .label{font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

.container{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.section-title{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;display:flex;align-items:center;gap:12px}
.section-title .icon{width:36px;height:36px;background:rgba(245,158,11,0.12);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.section-subtitle{color:var(--text-muted);font-size:14px}
.view-all{color:var(--accent-gold);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:gap 0.2s}.view-all:hover{opacity:.8}
.tabs{display:flex;gap:4px;background:var(--bg-secondary);border-radius:12px;padding:4px;margin-bottom:28px;width:fit-content;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.2s;border:none;background:none;font-family:'Source Sans 3',sans-serif;white-space:nowrap}
.tab:hover{color:var(--text-secondary)}.tab.active{background:var(--bg-card);color:var(--accent-gold);box-shadow:0 2px 8px rgba(0,0,0,0.3)}

.tips-table{width:100%;border-collapse:separate;border-spacing:0 6px}
.tips-table thead th{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);font-weight:600;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}
.tips-table tbody tr{background:var(--bg-card);transition:all 0.2s;cursor:pointer}.tips-table tbody tr:hover{background:var(--bg-card-hover)}
.tips-table td{padding:16px;font-size:14px;vertical-align:middle}.tips-table td:first-child{border-radius:10px 0 0 10px}.tips-table td:last-child{border-radius:0 10px 10px 0}
.match-teams{font-weight:600;font-size:15px}.match-league{font-size:12px;color:var(--text-muted)}
.match-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-secondary)}.match-time .date{color:var(--text-muted);font-size:11px}
.tip-pick{display:inline-flex;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);color:var(--accent-green);padding:5px 14px;border-radius:6px;font-weight:700;font-size:13px}
.tip-odds{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent-gold);font-size:15px}
.confidence-bar{width:60px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.confidence-fill{height:100%;border-radius:3px}.confidence-fill.high{background:var(--accent-green)}.confidence-fill.mid{background:var(--accent-gold)}.confidence-fill.low{background:var(--accent-red)}
.status-badge{padding:4px 12px;border-radius:50px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.status-badge.win{background:rgba(16,185,129,0.15);color:var(--accent-green)}.status-badge.lose{background:rgba(239,68,68,0.15);color:var(--accent-red)}
.status-badge.pending{background:rgba(59,130,246,0.15);color:var(--accent-blue)}.status-badge.void{background:rgba(100,116,139,0.15);color:var(--text-muted)}

.premium-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.premium-tip-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;position:relative;overflow:hidden;transition:all 0.3s}
.premium-tip-card:hover{border-color:rgba(245,158,11,0.3);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.premium-tip-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient-gold)}
.premium-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.premium-league{font-size:12px;color:var(--accent-gold);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.premium-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted)}
.premium-match{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;margin-bottom:16px;line-height:1.3}.premium-match .vs{color:var(--text-muted);font-size:14px;font-family:'Source Sans 3',sans-serif;margin:0 8px}
.premium-locked{position:relative;background:rgba(10,14,23,0.6);border:1px dashed var(--border-accent);border-radius:10px;padding:20px;text-align:center;backdrop-filter:blur(6px)}
.locked-content{filter:blur(8px);user-select:none;pointer-events:none;font-size:14px;color:var(--text-muted);line-height:1.8}
.lock-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.lock-icon{font-size:28px;margin-bottom:6px}.lock-text{font-size:13px;font-weight:600;color:var(--accent-gold)}
.btn-unlock{display:inline-flex;align-items:center;gap:8px;background:var(--gradient-gold);color:var(--bg-primary);padding:10px 24px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;margin-top:16px;transition:all 0.25s;font-family:'Source Sans 3',sans-serif}.btn-unlock:hover{transform:translateY(-2px);box-shadow:var(--shadow-glow)}

.pricing-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start}
.pricing-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center;position:relative;transition:all 0.3s}
.pricing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-card)}
.pricing-card.popular{border-color:var(--accent-gold);box-shadow:var(--shadow-glow);transform:scale(1.04)}.pricing-card.popular:hover{transform:scale(1.04) translateY(-4px)}
.popular-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gradient-gold);color:var(--bg-primary);padding:4px 20px;border-radius:50px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.pricing-name{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;margin-bottom:8px}
.pricing-price .amount{font-family:'Oswald',sans-serif;font-size:42px;font-weight:700;color:var(--accent-gold)}
.pricing-price .currency{font-size:16px;color:var(--text-muted);vertical-align:super}.pricing-price .period{font-size:14px;color:var(--text-muted)}
.pricing-save{font-size:12px;color:var(--accent-green);font-weight:600;margin-bottom:20px;min-height:18px}
.pricing-features{list-style:none;text-align:left;margin-bottom:28px}
.pricing-features li{padding:8px 0;font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(30,41,59,0.5)}
.pricing-features li:last-child{border-bottom:none}.pricing-features .check{color:var(--accent-green);flex-shrink:0}.pricing-features .cross{color:var(--text-muted);flex-shrink:0;opacity:0.4}
.btn-pricing{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.25s;font-family:'Source Sans 3',sans-serif;border:none}
.btn-pricing.primary{background:var(--gradient-gold);color:var(--bg-primary)}.btn-pricing.primary:hover{box-shadow:var(--shadow-glow)}
.btn-pricing.secondary{background:transparent;border:1px solid var(--border-accent);color:var(--text-primary)}.btn-pricing.secondary:hover{border-color:var(--accent-gold);color:var(--accent-gold)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center}
.stat-card .stat-value{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;margin-bottom:6px}
.stat-card .stat-value.green{color:var(--accent-green)}.stat-card .stat-value.gold{color:var(--accent-gold)}.stat-card .stat-value.blue{color:var(--accent-blue)}.stat-card .stat-value.red{color:var(--accent-red)}
.stat-card .stat-label{font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

.history-table{width:100%;border-collapse:separate;border-spacing:0}
.history-table th{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);font-weight:600;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}
.history-table td{padding:14px 16px;font-size:14px;border-bottom:1px solid rgba(30,41,59,0.3)}.history-table tr:hover td{background:rgba(26,34,54,0.5)}

.history-filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.filter-select{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:8px 14px;border-radius:8px;font-size:13px;font-family:'Source Sans 3',sans-serif;cursor:pointer;outline:none}.filter-select:focus{border-color:var(--accent-gold)}
.history-summary{display:flex;gap:24px;padding:16px 20px;background:var(--bg-card);border-radius:12px;border:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;align-items:center}
.summary-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.summary-dot.win{background:var(--accent-green)}.summary-dot.lose{background:var(--accent-red)}.summary-dot.total{background:var(--accent-gold)}
.summary-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;margin-right:4px}.summary-label{font-size:13px;color:var(--text-muted)}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:28px}
.page-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-family:'Source Sans 3',sans-serif}
.page-btn:hover{border-color:var(--accent-gold);color:var(--accent-gold)}.page-btn.active{background:var(--accent-gold);color:var(--bg-primary);border-color:var(--accent-gold)}.page-btn.nav-btn{width:auto;padding:0 14px}

.deposit-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.deposit-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:all 0.25s}
.deposit-card:hover{border-color:var(--accent-gold);transform:translateY(-2px)}.deposit-card.selected{border-color:var(--accent-gold);background:rgba(245,158,11,0.05)}
.method-icon{font-size:32px;margin-bottom:10px}.method-name{font-weight:600;font-size:15px;margin-bottom:4px}.method-desc{font-size:12px;color:var(--text-muted)}
.deposit-info{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;display:none}.deposit-info.show{display:block;animation:slideDown 0.3s ease-out}
.deposit-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.deposit-row:last-child{border-bottom:none}
.deposit-label{color:var(--text-muted);font-size:14px}.deposit-value{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.btn-copy{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);color:var(--accent-gold);padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Source Sans 3',sans-serif}.btn-copy:hover{background:rgba(245,158,11,0.2)}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:2000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:20px;max-width:90vw;padding:36px;animation:slideDown 0.3s ease-out;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px}.modal-close:hover{background:var(--bg-card);color:var(--text-primary)}
.modal h3{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;margin-bottom:20px}
.modal-input,.admin-input{width:100%;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:14px;font-family:'Source Sans 3',sans-serif;margin-bottom:12px;outline:none}.modal-input:focus,.admin-input:focus{border-color:var(--accent-gold)}.modal-input::placeholder,.admin-input::placeholder{color:var(--text-muted)}
.modal-btn{width:100%;padding:14px;background:var(--gradient-gold);border:none;border-radius:10px;color:var(--bg-primary);font-size:15px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;margin-top:8px}.modal-btn:hover{box-shadow:var(--shadow-glow)}
.modal-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text-muted);font-size:13px}.modal-divider::before,.modal-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.modal-link{text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted)}.modal-link a{color:var(--accent-gold);text-decoration:none;font-weight:600;cursor:pointer}

footer{border-top:1px solid var(--border);padding:40px 24px;margin-top:60px}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.footer-brand{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--accent-gold)}.footer-copy{font-size:13px;color:var(--text-muted)}
.footer-links{display:flex;gap:24px}.footer-links a{color:var(--text-muted);text-decoration:none;font-size:13px}.footer-links a:hover{color:var(--accent-gold)}
.social-icon{width:38px;height:38px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);text-decoration:none;font-size:16px}.social-icon:hover{border-color:var(--accent-gold);color:var(--accent-gold)}
.notification{position:fixed;bottom:24px;right:24px;background:var(--bg-card);border:1px solid var(--accent-green);border-radius:12px;padding:16px 24px;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:3000;animation:slideDown 0.3s ease-out;max-width:360px}.notification.show{display:flex}
.ok-msg{margin-top:16px;padding:14px;background:rgba(16,185,129,0.08);border-radius:10px;font-size:13px;color:var(--accent-green);text-align:center}
.page-section{display:none}.page-section.active{display:block}

/* ===== ADMIN PANEL ===== */
.admin-panel{margin-top:68px;padding:40px 0 60px}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.admin-header h2{font-family:'Oswald',sans-serif;font-size:32px;display:flex;align-items:center;gap:12px}
.admin-tabs{display:flex;gap:6px;margin-bottom:32px;flex-wrap:wrap}

function renderHistory(){
  const typeF=document.getElementById('hf-type')?.value||'all';

  const leagueF=document.getElementById('hf-league')?.value||'all';
  let f=allTips.filter(h=>h.st!=='pending').sort((a,b)=>b.id-a.id);
  if(typeF!=='all')f=f.filter(h=>h.ty===typeF);
  if(resultF!=='all')f=f.filter(h=>h.st===resultF);
  if(leagueF!=='all')f=f.filter(h=>h.lk===leagueF);

  const pl=f.reduce((s,x)=>s+(x.st==='win'?parseFloat(x.odds)-1:-1),0);

  <div class="history-summary"><span><span class="summary-dot total"></span><span class="summary-num">${f.length}</span><span class="summary-label">${t('sm_total')}</span></span><span><span class="summary-dot win"></span><span class="summary-num" style="color:var(--accent-green)">${w}</span><span class="summary-label">${t('sm_win')}</span></span><span><span class="summary-dot lose"></span><span class="summary-num" style="color:var(--accent-red)">${lo}</span><span class="summary-label">${t('sm_lose')}</span></span><span style="margin-left:auto"><span class="summary-label">${t('sm_profit')}: </span><span class="summary-num" style="color:${pl>=0?'var(--accent-green)':'var(--accent-red)'}">${pl>=0?'+':''}${pl.toFixed(2)}</span></span><span><span class="summary-label">${t('sm_wr')}: </span><span class="summary-num" style="color:var(--accent-gold)">${wr_}%</span></span></div>

// ===== FOOTBALL DATA API =====
const FOOTBALL_API_KEY = 'a893dce26cca4f15950d60deb9229afd';
const API_BASE = 'https://api.football-data.org/v4';
const CORS_PROXY = 'https://corsproxy.io/?';

async function apiFetch(url){
  // Try direct first
  try{
    const r = await fetch(url, {
      headers: {'X-Auth-Token': FOOTBALL_API_KEY},
      mode: 'cors'
    });
    if(r.ok) return await r.json();
  }catch(e){}
  // Fallback: CORS proxy
  try{
    const r2 = await fetch(CORS_PROXY + encodeURIComponent(url), {
      headers: {'X-Auth-Token': FOOTBALL_API_KEY}
    });
    if(r2.ok) return await r2.json();
    throw new Error('API status: ' + r2.status);
  }catch(e2){
    // Try another proxy
    const r3 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url + '&X-Auth-Token=' + FOOTBALL_API_KEY));
    if(r3.ok) return await r3.json();
    throw new Error('Không thể kết nối API sau nhiều lần thử');
  }
}

// League mapping: our key → API competition code
const lgToApi = {epl:'PL',laliga:'PD',seriea:'SA',bundesliga:'BL1',ligue1:'FL1',ucl:'CL'};

// Team name matching - fuzzy match
function teamMatch(apiName, ourName){
  const a = apiName.toLowerCase().replace(/\s*(fc|cf|sc|ac|ss|ssc|afc)\s*/g,' ').trim();
  const b = ourName.toLowerCase().trim();
  if(a.includes(b)||b.includes(a)) return true;
  // Common aliases
  const aliases = {
    'manchester city':'man city','manchester united':'man united','manchester utd':'man united',
    'tottenham hotspur':'tottenham','wolverhampton':'wolves','wolverhampton wanderers':'wolves',
    'newcastle united':'newcastle','west ham united':'west ham','nottingham forest':'nottingham',
    'crystal palace':'crystal palace','leicester city':'leicester','aston villa':'aston villa',
    'borussia dortmund':'dortmund','bayer leverkusen':'leverkusen','rb leipzig':'leipzig',
    'eintracht frankfurt':'frankfurt','vfb stuttgart':'stuttgart','sc freiburg':'freiburg',
    'bayern münchen':'bayern','bayern munich':'bayern','bayern munchen':'bayern',
    'atlético madrid':'atletico madrid','atletico de madrid':'atletico madrid','club atlético':'atletico',
    'real betis':'betis','villarreal':'villarreal','real sociedad':'sociedad','getafe':'getafe',
    'fc barcelona':'barcelona','real madrid':'real madrid',
    'internazionale':'inter milan','inter':'inter milan','inter milano':'inter milan',
    'ac milan':'ac milan','milan':'ac milan','ssc napoli':'napoli','as roma':'roma',
    'juventus':'juventus','ss lazio':'lazio','atalanta':'atalanta',
    'paris saint-germain':'psg','paris sg':'psg','olympique marseille':'marseille',
    'olympique lyonnais':'lyon','olympique lyon':'lyon','as monaco':'monaco',
    'lille':'lille','losc lille':'lille',
  };
  const aNorm = aliases[a]||a;
  const bNorm = aliases[b]||b;
  if(aNorm.includes(bNorm)||bNorm.includes(aNorm)) return true;
  // Check partial overlap (first word match for short names)
  const aWords = aNorm.split(' ');
  const bWords = bNorm.split(' ');
  if(bWords[0].length >= 4 && aWords.some(w=>w===bWords[0])) return true;
  if(aWords[0].length >= 4 && bWords.some(w=>w===aWords[0])) return true;
  return false;
}

// Evaluate tip result based on score
function evaluateTip(tipStr, homeScore, awayScore, homeTeam, awayTeam, ourHome, ourAway){
  const tip = tipStr.toLowerCase().trim();
  const total = homeScore + awayScore;

  // Over/Under (Tài/Xỉu)
  const overMatch = tip.match(/(?:over|tài)\s*([\d.]+)/);
  if(overMatch){
    const line = parseFloat(overMatch[1]);
    return total > line ? 'win' : total < line ? 'lose' : 'void';
  }
  const underMatch = tip.match(/(?:under|xỉu)\s*([\d.]+)/);
  if(underMatch){
    const line = parseFloat(underMatch[1]);
    return total < line ? 'win' : total > line ? 'lose' : 'void';
  }

  // BTTS (Both Teams To Score)
  if(tip.includes('btts')){
    const bttsYes = tip.includes('yes')||tip.includes('có')||tip.includes('co');
    const bothScored = homeScore > 0 && awayScore > 0;
    if(bttsYes) return bothScored ? 'win' : 'lose';
    return !bothScored ? 'win' : 'lose';
  }

  // Handicap: "Team -X" or "Team +X"
  const hcMatch = tip.match(/(.+?)\s*([+-]?\s*[\d.]+(?:\/[\d.]+)?)\s*$/);
  if(hcMatch){
    let teamPart = hcMatch[1].trim();
    let hcLine = hcMatch[2].replace(/\s/g,'');
    // Handle Asian handicap like -0.5/1 → average
    let hcVal;
    if(hcLine.includes('/')){
      const parts = hcLine.split('/').map(Number);
      hcVal = (parts[0]+parts[1])/2;
    } else {
      hcVal = parseFloat(hcLine);
    }
    // Determine which team the tip is on
    let tipOnHome = teamMatch(homeTeam, teamPart) || teamMatch(ourHome, teamPart);
    let tipOnAway = !tipOnHome && (teamMatch(awayTeam, teamPart) || teamMatch(ourAway, teamPart));
    if(!tipOnHome && !tipOnAway){
      // Try to figure out from first word
      const tw = teamPart.toLowerCase().split(' ')[0];
      if(ourHome.toLowerCase().includes(tw)) tipOnHome = true;
      else if(ourAway.toLowerCase().includes(tw)) tipOnAway = true;
    }
    let margin;
    if(tipOnHome) margin = homeScore - awayScore + hcVal;
    else if(tipOnAway) margin = awayScore - homeScore + hcVal;
    else return null; // can't determine
    if(margin > 0) return 'win';
    if(margin < 0) return 'lose';
    return 'void';
  }

  return null; // can't auto-evaluate
}

async function autoFetchResults(){
  const btn = document.getElementById('btn-fetch-results');
  const statusEl = document.getElementById('fetch-status');
  const logEl = document.getElementById('fetch-results-log');
  const pendingTips = allTips.filter(t=>t.st==='pending');

  if(pendingTips.length === 0){
    statusEl.innerHTML = '⚠️ Không có tip nào đang chờ kết quả!';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Đang tải...';
  statusEl.innerHTML = '🔄 Đang lấy dữ liệu từ football-data.org...';
  logEl.innerHTML = '';

  try {
    // Fetch last 5 days of finished matches
    const today = new Date();
    const from = new Date(today);
    from.setDate(from.getDate() - 5);
    const dateFrom = from.toISOString().split('T')[0];
    const dateTo = today.toISOString().split('T')[0];

    const resp = await apiFetch(`${API_BASE}/matches?status=FINISHED&dateFrom=${dateFrom}&dateTo=${dateTo}`);
    const matches = resp.matches || [];

    let updated = 0, notFound = 0, cantEval = 0;
    let logHTML = '<div style="margin-top:12px">';

    for(const tip of pendingTips){
      // Find matching match in API results
      let foundMatch = null;
      for(const m of matches){
        const apiHome = m.homeTeam?.name || m.homeTeam?.shortName || '';
        const apiAway = m.awayTeam?.name || m.awayTeam?.shortName || '';
        if(teamMatch(apiHome, tip.h) && teamMatch(apiAway, tip.a)){
          foundMatch = m; break;
        }
        // Also try reversed
        if(teamMatch(apiHome, tip.a) && teamMatch(apiAway, tip.h)){
          foundMatch = m; break;
        }
      }

      if(!foundMatch){
        notFound++;
        logHTML += `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:rgba(100,116,139,0.1);font-size:13px">⏳ <strong>${tip.h} vs ${tip.a}</strong> — Chưa có kết quả (trận chưa đá hoặc không tìm thấy)</div>`;
        continue;
      }

      const hs = foundMatch.score?.fullTime?.home;
      const as = foundMatch.score?.fullTime?.away;
      if(hs == null || as == null){
        notFound++;
        continue;
      }

      const score = `${hs}-${as}`;
      const apiHome = foundMatch.homeTeam?.name||'';
      const apiAway = foundMatch.awayTeam?.name||'';
      const result = evaluateTip(tip.tip, hs, as, apiHome, apiAway, tip.h, tip.a);

      if(result && (result === 'win' || result === 'lose')){
        tip.sc = score;
        tip.st = result;
        updated++;
        const icon = result === 'win' ? '✅' : '❌';
        const color = result === 'win' ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)';
        logHTML += `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:${color};font-size:13px">${icon} <strong>${tip.h} vs ${tip.a}</strong> → Tỷ số: <strong>${score}</strong> → Tip "${tip.tip}" = <strong>${result.toUpperCase()}</strong></div>`;
      } else if(result === 'void'){
        tip.sc = score;
        tip.st = 'void';
        updated++;
        logHTML += `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:rgba(100,116,139,0.1);font-size:13px">↩️ <strong>${tip.h} vs ${tip.a}</strong> → Tỷ số: ${score} → Tip "${tip.tip}" = <strong>VOID</strong></div>`;
      } else {
        tip.sc = score;
        cantEval++;
        logHTML += `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;background:rgba(245,158,11,0.1);font-size:13px">⚠️ <strong>${tip.h} vs ${tip.a}</strong> → Tỷ số: ${score} → Không tự đánh giá được tip "${tip.tip}" — <button class="btn-edit" onclick="setStatus(${tip.id},'win')">✅ Win</button> <button class="btn-del" onclick="setStatus(${tip.id},'lose')">❌ Lose</button></div>`;
      }
    }

    logHTML += '</div>';
    logEl.innerHTML = logHTML;

    if(updated > 0){
      saveData();
      renderAll();
    }

    statusEl.innerHTML = `✅ Hoàn tất! Cập nhật: <strong style="color:var(--accent-green)">${updated}</strong> tip | Chưa có KQ: <strong>${notFound}</strong> | Cần xử lý tay: <strong>${cantEval}</strong>`;

  } catch(err){
    statusEl.innerHTML = `❌ Lỗi: ${err.message}`;
    logEl.innerHTML = `<div style="padding:12px;background:rgba(239,68,68,0.1);border-radius:8px;font-size:13px;color:var(--accent-red)">Không thể kết nối API. Kiểm tra: Internet, API key, hoặc thử lại sau 1 phút (giới hạn 10 request/phút).</div>`;
  }

  btn.disabled = false;
  btn.textContent = '⚡ Cập Nhật Kết Quả Tự Động';
}

function setStatus(id,st){
  const tip=allTips.find(t=>t.id===id);
  if(tip){
    tip.st=st;
    if(st!=='pending'&&!tip.sc){
      const sc=prompt('Nhập tỷ số (VD: 2-1):');
      if(sc)tip.sc=sc;
    }
    saveData();renderAll();showNotif(`✅ Cập nhật: ${tip.h} vs ${tip.a} → ${st.toUpperCase()}`);
  }
}

function deleteTip(id){
  if(!confirm('Xóa tip này?'))return;
  allTips=allTips.filter(t=>t.id!==id);

}

function editTip(id){
  const tip=allTips.find(t=>t.id===id);if(!tip)return;
  document.getElementById('edit-tip-body').innerHTML=`<h3>✏️ Sửa Tip #${id}</h3>
  <div class="form-row"><div class="form-group"><label>Đội nhà</label><input class="admin-input" id="et-home" value="${tip.h}"></div><div class="form-group"><label>Đội khách</label><input class="admin-input" id="et-away" value="${tip.a}"></div></div>
  <div class="form-row tri"><div class="form-group"><label>Giờ</label><input class="admin-input" id="et-time" value="${tip.time}"></div><div class="form-group"><label>Ngày</label><input class="admin-input" id="et-date" value="${tip.date}"></div><div class="form-group"><label>Giải</label><select class="admin-select" id="et-league">${Object.entries(lgN).map(([k,v])=>`<option value="${k}" ${tip.lk===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
  <div class="form-row tri"><div class="form-group"><label>Tip</label><input class="admin-input" id="et-tip" value="${tip.tip}"></div><div class="form-group"><label>Odds</label><input class="admin-input" id="et-odds" value="${tip.odds}" type="number" step="0.01"></div><div class="form-group"><label>Tin cậy %</label><input class="admin-input" id="et-conf" value="${tip.conf}" type="number"></div></div>
  <div class="form-row"><div class="form-group"><label>Loại</label><select class="admin-select" id="et-type"><option value="free" ${tip.ty==='free'?'selected':''}>🆓 Free</option><option value="vip" ${tip.ty==='vip'?'selected':''}>👑 VIP</option></select></div><div class="form-group"><label>Tỷ số</label><input class="admin-input" id="et-score" value="${tip.sc}" placeholder="2-1"></div></div>
  <div class="form-row full"><div class="form-group"><label>Phân tích</label><textarea class="admin-textarea" id="et-analysis">${tip.analysis||''}</textarea></div></div>
  <button class="btn-admin gold" onclick="saveEditTip(${id})" style="margin-top:8px">💾 Lưu Thay Đổi</button>`;
  openModal('edit-tip');
}

function saveEditTip(id){
  const tip=allTips.find(t=>t.id===id);if(!tip)return;
  tip.h=document.getElementById('et-home').value.trim();
  tip.a=document.getElementById('et-away').value.trim();
  tip.time=document.getElementById('et-time').value.trim();
  tip.date=document.getElementById('et-date').value.trim();
  tip.lk=document.getElementById('et-league').value;
  tip.lg=lgN[tip.lk];
  tip.tip=document.getElementById('et-tip').value.trim();
  tip.odds=parseFloat(document.getElementById('et-odds').value);
  tip.conf=parseInt(document.getElementById('et-conf').value);
  tip.ty=document.getElementById('et-type').value;
  tip.sc=document.getElementById('et-score').value.trim();
  tip.analysis=document.getElementById('et-analysis').value.trim();
  saveData();closeModal('edit-tip');renderAll();showNotif('✅ Đã cập nhật tip!');
}

function savePricing(){
  pricing.forEach(p=>{
    p.amount=document.getElementById('price-'+p.id).value;
    p.save=document.getElementById('save-'+p.id).value;
    p.saveEn=document.getElementById('saveen-'+p.id).value;
    p.popular=document.getElementById('pop-'+p.id).checked;
  });
  saveData();renderAll();showNotif('✅ Đã lưu bảng giá!');
}

function saveAdminCreds(){
  const nu=document.getElementById('new-user').value.trim();
  const np=document.getElementById('new-pass').value;
  if(!nu){showNotif('❌ Tên đăng nhập không được trống!');return;}
  localStorage.setItem('tk_admin_user',nu);
  if(np.length>=4){localStorage.setItem('tk_admin_pass',np);showNotif('✅ Đã lưu tên đăng nhập & mật khẩu mới!');}
  else if(np.length===0){showNotif('✅ Đã lưu tên đăng nhập! (Mật khẩu giữ nguyên)');}
  else{showNotif('❌ Mật khẩu tối thiểu 4 ký tự!');}
}

function resetData(){
  if(!confirm('XÓA TOÀN BỘ DATA và khôi phục mặc định?'))return;
  localStorage.removeItem('tk_tips');localStorage.removeItem('tk_pricing');localStorage.removeItem('tk_admin_user');localStorage.removeItem('tk_admin_pass');
  allTips=[...defaultTips];pricing=[...defaultPricing];nextId=Math.max(...allTips.map(t=>t.id))+1;
  renderAll();showNotif('🔄 Đã reset data! (Username: admin / Pass: tipking2026)');
}

// ===== NAV & UTILS =====
function showPage(p){
  try{
    document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
    const el=document.getElementById('page-'+p);
    if(el){el.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
    document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('data-page')===p));
    if(p==='admin'){try{renderAdmin();}catch(e){document.getElementById('admin-content').innerHTML='<div style="margin-top:100px;padding:40px;text-align:center"><h2>Admin Panel</h2><p style="color:red">Error: '+e.message+'</p></div>';}}
  }catch(e){console.error('showPage error:',e);}
}
function openModal(t){document.getElementById('modal-'+t).classList.add('show');document.body.style.overflow='hidden';}
function closeModal(t){document.getElementById('modal-'+t).classList.remove('show');document.body.style.overflow='';}
document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o){o.classList.remove('show');document.body.style.overflow='';}});});
function selectDeposit(m,el){document.querySelectorAll('.deposit-card').forEach(c=>c.classList.remove('selected'));document.querySelectorAll('.deposit-info').forEach(i=>i.classList.remove('show'));el.classList.add('selected');const info=document.getElementById('dep-'+m);if(info)info.classList.add('show');}
function copyText(tx){navigator.clipboard.writeText(tx).then(()=>showNotif(t('copied')+tx));}
function showNotif(tx){const n=document.getElementById('notification');document.getElementById('notif-text').textContent=tx;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3000);}

renderAll();
</script>
</body>
</html>
